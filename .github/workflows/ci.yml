name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "fastapi>=0.141.0" "pydantic>=2.13.0" "uvicorn>=0.52.0" "websockets>=17.0" "httpx>=0.28.0" "prometheus-client>=0.17.0" "jsonschema>=4.20.0" "PyJWT>=2.8.0"
        pip install pytest pytest-asyncio pytest-cov
        
    - name: Run Test Suite with Coverage
      run: |
        pytest --cov=src/micelio --cov-report=xml
        
    - name: Ensure strict 95% test coverage
      run: |
        pytest --cov=src/micelio --cov-fail-under=95
