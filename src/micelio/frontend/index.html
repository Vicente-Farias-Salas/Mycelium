<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mycelium Enterprise Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            bg: '#050a0e',
                            panel: '#0a1118',
                            border: '#112233',
                            neon: '#00ff9d',
                            blue: '#00e5ff',
                            text: '#8ca8c3',
                            muted: '#3a5266'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cyber-bg text-cyber-text font-sans antialiased selection:bg-cyber-neon selection:text-black">
    <div class="min-h-screen flex flex-col">
        <!-- Top Navigation -->
        <header class="bg-cyber-panel border-b border-cyber-border sticky top-0 z-30 shadow-[0_0_20px_rgba(0,255,157,0.05)]">
            <div class="px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded animate-pulse bg-cyber-neon shadow-[0_0_15px_rgba(0,255,157,0.6)]"></div>
                        <span class="text-xl font-bold tracking-widest text-white">MYCELIUM<span class="text-cyber-neon font-mono">_SYS</span></span>
                        <nav class="hidden md:block ml-10">
                            <ul class="flex space-x-6 text-sm font-mono">
                                <li><a href="#" class="text-cyber-neon border-b border-cyber-neon pb-1">VIRTUAL_OFFICE</a></li>
                                <li><a href="#" class="text-cyber-muted hover:text-white transition-colors">PROJECTS</a></li>
                                <li><a href="#" class="text-cyber-muted hover:text-white transition-colors">NODES</a></li>
                            </ul>
                        </nav>
                    </div>
                    <div class="flex items-center gap-3">
                        <a href="https://github.com/sponsors/Vicente-Farias-Salas" target="_blank" rel="noopener noreferrer" class="font-mono bg-pink-950/40 border border-pink-500/50 text-pink-400 hover:bg-pink-500 hover:text-white px-3 py-2 rounded text-xs tracking-wider transition-all duration-300 shadow-[0_0_10px_rgba(236,72,153,0.2)] hover:shadow-[0_0_15px_rgba(236,72,153,0.5)] flex items-center gap-1.5">
                            <span>💖</span> SPONSOR
                        </a>
                        <button id="crunch-btn" onclick="triggerCrunch()" class="font-mono bg-cyber-panel border border-cyber-neon text-cyber-neon hover:bg-cyber-neon hover:text-black px-4 py-2 rounded text-xs tracking-wider transition-all duration-300 shadow-[0_0_10px_rgba(0,255,157,0.2)] hover:shadow-[0_0_20px_rgba(0,255,157,0.6)] cursor-pointer">
                            INIT_CRUNCH()
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Left Column: Metrics -->
                <div class="lg:col-span-2 space-y-6">
                    <div>
                        <h2 class="text-xs tracking-widest font-mono text-cyber-muted uppercase mb-3">Network Telemetry</h2>
                        <dl class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                            <!-- Metric 1 -->
                            <div class="bg-cyber-panel p-5 rounded border border-cyber-border relative overflow-hidden group">
                                <div class="absolute top-0 right-0 w-16 h-16 bg-cyber-blue opacity-5 blur-2xl group-hover:opacity-20 transition-opacity"></div>
                                <dt class="text-xs font-mono text-cyber-muted uppercase tracking-wider">Active Swarms</dt>
                                <dd class="mt-2 text-4xl font-mono text-white" id="metric-projects">0</dd>
                            </div>
                            <!-- Metric 2 -->
                            <div class="bg-cyber-panel p-5 rounded border border-cyber-border relative overflow-hidden group">
                                <div class="absolute top-0 right-0 w-16 h-16 bg-cyber-neon opacity-5 blur-2xl group-hover:opacity-20 transition-opacity"></div>
                                <dt class="text-xs font-mono text-cyber-muted uppercase tracking-wider">Synapse Volatility</dt>
                                <dd class="mt-2 text-4xl font-mono text-cyber-neon shadow-neon" id="metric-events">0</dd>
                                <div class="absolute bottom-0 left-0 right-0 h-10 flex items-end justify-between px-1 gap-[2px] opacity-30" id="sparkline-container">
                                    <!-- Sparkline bars injected here -->
                                </div>
                            </div>
                            <!-- Metric 3 -->
                            <div class="bg-cyber-panel p-5 rounded border border-cyber-border relative overflow-hidden group">
                                <dt class="text-xs font-mono text-cyber-muted uppercase tracking-wider">System Integrity</dt>
                                <dd class="mt-2 text-4xl font-mono text-white">99.9<span class="text-lg text-cyber-muted">%</span></dd>
                            </div>
                        </dl>
                    </div>

                    <!-- Project List -->
                    <div>
                        <h2 class="text-xs tracking-widest font-mono text-cyber-muted uppercase mb-3">Substrate Nodes</h2>
                        <div class="bg-cyber-panel border border-cyber-border rounded overflow-hidden">
                            <ul role="list" class="divide-y divide-cyber-border" id="project-list">
                                <li class="px-5 py-4 hover:bg-[#0d1620] transition-colors flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-mono text-cyber-blue">PRJ-ALPHA-77</p>
                                        <p class="mt-1 text-xs text-cyber-muted font-mono">Neural network alignment</p>
                                    </div>
                                    <div class="flex items-center gap-2 text-xs font-mono text-cyber-neon border border-cyber-neon/30 bg-cyber-neon/5 px-2 py-1 rounded">
                                        <span class="w-2 h-2 rounded-full bg-cyber-neon animate-pulse"></span> ONLINE
                                    </div>
                                </li>
                                <li class="px-5 py-4 hover:bg-[#0d1620] transition-colors flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-mono text-cyber-blue">PRJ-OMEGA-12</p>
                                        <p class="mt-1 text-xs text-cyber-muted font-mono">Market analysis swarm</p>
                                    </div>
                                    <div class="flex items-center gap-2 text-xs font-mono text-cyber-neon border border-cyber-neon/30 bg-cyber-neon/5 px-2 py-1 rounded">
                                        <span class="w-2 h-2 rounded-full bg-cyber-neon animate-pulse"></span> ONLINE
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Live Feed -->
                <div class="space-y-6">
                    <div>
                        <div class="flex justify-between items-end mb-3">
                            <h2 class="text-xs tracking-widest font-mono text-cyber-muted uppercase">Synapse Stream</h2>
                            <span class="flex h-2 w-2 relative">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyber-neon opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2 w-2 bg-cyber-neon"></span>
                            </span>
                        </div>
                        <div class="bg-cyber-panel border border-cyber-border rounded p-4 h-[600px] overflow-y-auto custom-scrollbar relative">
                            <!-- Gradient Fade for top -->
                            <div class="sticky top-0 left-0 right-0 h-8 bg-gradient-to-b from-cyber-panel to-transparent z-10 pointer-events-none"></div>
                            
                            <div class="space-y-3" id="live-feed">
                                <!-- Feed Items -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function fetchAnalytics() {
            try {
                const response = await fetch('/api/analytics/overview');
                if (response.ok) {
                    const data = await response.json();
                    animateValue("metric-projects", 0, data.total_projects, 1000);
                    animateValue("metric-events", 0, data.total_events, 1000);
                }
            } catch (error) {
                console.warn('Analytics endpoint not ready or offline.');
            }
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            if (!obj) return;
            const current = parseInt(obj.innerText) || 0;
            if (current === end) return;
            
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - current) + current);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Sparkline Tracker
        const sparklineData = new Array(30).fill(0);
        
        function updateSparkline() {
            const container = document.getElementById("sparkline-container");
            if(!container) return;
            container.innerHTML = '';
            
            const maxVal = Math.max(...sparklineData, 1);
            
            sparklineData.forEach(val => {
                const heightPct = Math.floor((val / maxVal) * 100);
                const bar = document.createElement("div");
                bar.className = "flex-1 bg-cyber-neon/80 rounded-t-sm transition-all duration-[800ms] ease-out";
                bar.style.height = `${heightPct}%`;
                // Add a glowing top edge if height > 0
                if(heightPct > 0) {
                    bar.style.borderTop = "1px solid #fff";
                    bar.style.boxShadow = "0 -2px 5px rgba(0,255,157,0.5)";
                }
                container.appendChild(bar);
            });
            
            sparklineData.shift();
            sparklineData.push(0);
        }

        async function fetchProjects() {
            try {
                const res = await fetch('/api/projects');
                if (res.ok) {
                    const projects = await res.json();
                    const list = document.getElementById("project-list");
                    if (projects && projects.length > 0) {
                        list.innerHTML = '';
                        projects.slice(0, 8).forEach(p => {
                            const li = document.createElement("li");
                            li.className = "px-5 py-4 hover:bg-[#0d1620] transition-colors flex items-center justify-between";
                            li.innerHTML = `
                                <div>
                                    <p class="text-sm font-mono text-cyber-blue">${p.id} — ${p.title}</p>
                                    <p class="mt-1 text-xs text-cyber-muted font-mono">${(p.vision || '').substring(0, 55)}...</p>
                                </div>
                                <div class="flex items-center gap-2 text-xs font-mono text-cyber-neon border border-cyber-neon/30 bg-cyber-neon/5 px-2 py-1 rounded">
                                    <span class="w-2 h-2 rounded-full bg-cyber-neon animate-pulse"></span> ${p.status}
                                </div>
                            `;
                            list.appendChild(li);
                        });
                    }
                }
            } catch (e) {
                // offline fallback
            }
        }

        async function triggerCrunch() {
            const btn = document.getElementById("crunch-btn");
            if (!btn) return;
            btn.innerText = "⚡ CRUNCH_ACTIVE...";
            btn.classList.add("animate-pulse", "!bg-cyber-neon", "!text-black");
            try {
                await fetch('/api/simulation/demo', { method: 'POST' });
            } catch (err) {
                console.error("Simulation trigger failed:", err);
            }
            setTimeout(() => {
                btn.innerText = "INIT_CRUNCH()";
                btn.classList.remove("animate-pulse", "!bg-cyber-neon", "!text-black");
                fetchAnalytics();
                fetchProjects();
            }, 3500);
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchAnalytics();
            fetchProjects();
            setInterval(fetchAnalytics, 4000);
            setInterval(fetchProjects, 6000);
            setInterval(updateSparkline, 1000);
            connectLiveFeed();
        });

        function connectLiveFeed() {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${protocol}//${window.location.host}/ws/analytics/live`;
            const ws = new WebSocket(wsUrl);
            const feedContainer = document.getElementById("live-feed");
            
            ws.onopen = () => {
                feedContainer.innerHTML = '';
                const notice = document.createElement("div");
                notice.className = "p-3 border border-cyber-blue/30 bg-cyber-blue/5 text-cyber-blue rounded font-mono text-xs text-center animate-pulse";
                notice.innerText = "[ LINK ESTABLISHED : SYNAPSE_BUS ]";
                feedContainer.appendChild(notice);
            };

            ws.onmessage = (event) => {
                sparklineData[29] += 1;
                const data = JSON.parse(event.data);
                
                if (feedContainer.firstElementChild && feedContainer.firstElementChild.innerText.includes("LINK ESTABLISHED")) {
                    feedContainer.innerHTML = '';
                }

                const item = document.createElement("div");
                item.className = "p-3 bg-[#0d1620] rounded border border-cyber-border text-sm animate-fade-in relative overflow-hidden group";
                
                // Left glowing accent bar
                const accent = document.createElement("div");
                accent.className = "absolute left-0 top-0 bottom-0 w-1";
                
                let titleColor = "text-cyber-blue";
                accent.className += " bg-cyber-blue shadow-[0_0_10px_rgba(0,229,255,0.5)]";
                
                if (data.event_type === "STATE_MUTATION") {
                    titleColor = "text-cyber-neon";
                    accent.className = accent.className.replace("cyber-blue", "cyber-neon").replace("0,229,255", "0,255,157");
                } else if (data.event_type === "AGENT_ERROR") {
                    titleColor = "text-rose-500";
                    accent.className = accent.className.replace("cyber-blue", "rose-500").replace("0,229,255", "244,63,94");
                }

                item.appendChild(accent);

                const payloadStr = JSON.stringify(data.payload).substring(0, 100) + (JSON.stringify(data.payload).length > 100 ? "..." : "");

                item.innerHTML += `
                    <div class="pl-2">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-mono text-xs ${titleColor}">${data.source_agent_id} &rarr; ${data.target_agent_id}</span>
                            <span class="text-[10px] font-mono text-cyber-muted">now</span>
                        </div>
                        <p class="text-cyber-text break-words font-mono text-xs mt-1 leading-relaxed opacity-80 group-hover:opacity-100 transition-opacity">${payloadStr}</p>
                    </div>
                `;
                
                feedContainer.prepend(item);
                
                if (feedContainer.children.length > 50) {
                    feedContainer.removeChild(feedContainer.lastChild);
                }
            };

            ws.onclose = () => {
                setTimeout(connectLiveFeed, 3000);
            };
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0a1118; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #112233; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3a5266; 
        }
        
        /* Optional text shadow for glowing text */
        .shadow-neon {
            text-shadow: 0 0 10px rgba(0,255,157,0.5);
        }
    </style>
</body>
</html>
